# render.yaml — Defines all services for Render deployment of MarketPlayground

services:
  # 🚀 Main FastAPI Web Service
  - type: web
    name: marketplayground-backend
    runtime: python
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ uvicorn backend.app:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    # Persistent disk: practice portfolios and user accounts survive deploys.
    disk:
      name: mp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CREATIVE_MAPPING
        value: "1"
      # v4 belief engine (set ENGINE_VERSION=legacy to use the old GPT-4 + ML engine)
      - key: ENGINE_VERSION
        value: v4
      - key: MP_DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: MP_CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: MP_ADMIN_TOKEN
        generateValue: true
      # Real money (Stage 2: people connect their own Alpaca account). OFF until a lawyer signs off.
      - key: MP_REAL_MONEY
        value: "off"
      - key: MP_BROKER_ENV
        value: paper
      - key: MP_MAX_ORDER_USD
        value: "1000"
      - key: MP_TOKEN_KEY
        generateValue: true
      - key: MP_SITE_URL
        value: https://marketplayground-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString
      # When turning real money on, add ALPACA_OAUTH_CLIENT_ID, ALPACA_OAUTH_CLIENT_SECRET and
      # ALPACA_OAUTH_REDIRECT_URI (= <backend>/v4/broker/callback) by hand in the Render dashboard.

  # (v4) The old retrain-worker was removed: it retrained the legacy ML models nonstop.
  #      Suspend/delete it in the Render dashboard. Code kept in backend/retrain_worker.py.

  # 🌐 The app website (React frontend), served as a static site
  - type: web
    runtime: static
    name: marketplayground-web
    # rootDir keeps Render from seeing the backend's requirements.txt and trying to pip-install it here.
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend address. If Render gives the backend a different URL (shown on its page),
      # update this and redeploy the website.
      - key: VITE_API_BASE
        value: https://marketplayground-backend-18mm.onrender.com
      - key: NODE_VERSION
        value: "22"

  # (v4) The hourly news-ingestor cron was removed: it wrote headlines to a local file that
  #      Render erases after each run, so it cost money and kept nothing. Code: backend/news_ingestor.py.

  # (v4) The old belief-feeder worker was removed: it only fed the legacy ML training CSV.
  #      Suspend/delete it in the Render dashboard. Code kept in backend/belief_feeder.py.

  # 📏 v4: grade every pick against real prices, then retrain the neural network (daily, after US close)
  - type: cron
    name: v4-grade-and-train
    runtime: python
    schedule: "47 22 * * 1-5"   # 22:47 UTC weekdays
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ python -m backend.v4.grader --train"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString

  # 🌱 v4: force-feeds beliefs so the network learns. Hourly: while warming up it adds a batch of
  #    past-dated beliefs graded right away (capped by MP_WARMUP_BUDGET_USD in total); once a day it
  #    adds fresh live beliefs; then grades and retrains. (Name kept so Render updates it in place.)
  - type: cron
    name: v4-seed-live
    runtime: python
    schedule: "13 * * * *"   # every hour at :13
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ python -m backend.v4.seeder auto"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MP_SEED_ENABLED
        value: "true"
      - key: MP_SEED_N
        value: "25"            # beliefs per day
      - key: MP_SEED_GENERATE
        value: "25"            # new beliefs Claude writes per day
      - key: MP_SEED_MAX_USD
        value: "1"             # hard daily cap on Claude spend
      - key: MP_SEED_MODEL
        value: claude-haiku-5-5
      - key: MP_WARMUP_GRADED
        value: "4000"          # stop force-feeding once this many picks are graded at 90 days
      - key: MP_WARMUP_BUDGET_USD
        value: "8"             # total Claude spend allowed for the warm-up, ever
      - key: MP_WARMUP_BATCH
        value: "80"            # past-dated beliefs per hourly run
      - key: MP_NEWS_SEED_N
        value: "6"             # real news hunches (and their opposites) per hourly run
      - key: MP_NEWS_SEED_MAX_USD
        value: "0.5"           # daily cap on news-seeding spend
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString

databases:
  # 🗄️ v4 shared learning database (all users' beliefs, picks, grades, network versions)
  - name: marketplayground-db
    plan: 0.1c-256mb
    databaseName: marketplayground
    user: marketplayground
