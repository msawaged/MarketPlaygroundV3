# render.yaml — Defines all services for Render deployment of MarketPlayground

services:
  # 🚀 Main FastAPI Web Service
  - type: web
    name: marketplayground-backend
    env: python
    plan: starter
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ uvicorn backend.app:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CREATIVE_MAPPING
        value: "1"
      # v4 belief engine (set ENGINE_VERSION=legacy to use the old GPT-4 + ML engine)
      - key: ENGINE_VERSION
        value: v4
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MP_CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: MP_ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString

  # (v4) The old retrain-worker was removed: it retrained the legacy ML models nonstop.
  #      Suspend/delete it in the Render dashboard. Code kept in backend/retrain_worker.py.

  # 📰 News Ingestor (Cron Job every hour)
  - type: cron
    name: news-ingestor
    env: python
    schedule: "0 * * * *"     # hourly
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ python backend/news_ingestor.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Safety gates (no-code throttles)
      - key: NEWS_INGESTOR_ENABLED
        value: "true"
      - key: NEWS_USE_LOCKFILE
        value: "true"         # refuse if previous hour still running
      - key: NEWS_MAX_FEEDS
        value: "5"
      - key: NEWS_PER_FEED_LIMIT
        value: "10"
      - key: NEWS_MAX_CONCURRENCY
        value: "1"            # keep it single-threaded on Starter
      - key: NEWS_POLL_SECONDS
        value: "999999"       # cron should do ONE pass and exit
      - key: NEWS_HTTP_TIMEOUT
        value: "10"
      - key: NEWS_RETRY_MAX
        value: "3"
      - key: NEWS_GLOBAL_RATE_QPS
        value: "1"            # simple global rate limit
      - key: NEWS_HARD_RSS_MB
        value: "450"          # self-terminate if memory climbs
      - key: NEWS_RUN_ONCE
        value: "true"         # if supported; otherwise LOG & exit after pass

  # (v4) The old belief-feeder worker was removed: it only fed the legacy ML training CSV.
  #      Suspend/delete it in the Render dashboard. Code kept in backend/belief_feeder.py.

  # 📏 v4: grade every pick against real prices, then retrain the neural network (daily, after US close)
  - type: cron
    name: v4-grade-and-train
    env: python
    schedule: "47 22 * * 1-5"   # 22:47 UTC weekdays
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ python -m backend.v4.grader --train"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString

  # 🌱 v4: daily live seeding so the network keeps getting clean, forward-graded examples
  - type: cron
    name: v4-seed-live
    env: python
    schedule: "13 15 * * 1-5"   # 15:13 UTC weekdays (market open)
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=./ python -m backend.v4.seeder live"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MP_SEED_ENABLED
        value: "true"
      - key: MP_SEED_N
        value: "25"            # beliefs per day
      - key: MP_SEED_GENERATE
        value: "25"            # new beliefs Claude writes per day
      - key: MP_SEED_MAX_USD
        value: "1"             # hard daily cap on Claude spend
      - key: MP_SEED_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: marketplayground-db
          property: connectionString

databases:
  # 🗄️ v4 shared learning database (all users' beliefs, picks, grades, network versions)
  - name: marketplayground-db
    plan: basic-256mb
    databaseName: marketplayground
    user: marketplayground
